<!-- Nav -->
<div class="nav-container" uk-sticky="show-on-up: true; animation: uk-animation-slide-top">
  <nav class="full-width">
    <ul class="nav-logo">
      {% for item in site.posts-logos %}
      <li>
        <a href="{{ item.href | relative_url }}" target="{{ item.target }}">
          <img src="{{ item.logo | relative_url }}">
        </a>
      </li>
      {% endfor %}
    </ul>
    <ul class="links-social-buttons-search">
      <li class="hidden-xs hidden-sm visible-lg">
        <ul class="nav-links">
          <!-- Links Data -->
          {% for item in site.posts-nav-links %}
          <li>
            <a class="{% if page.url == item.url %}nav-link-active{% endif %} {{ item.type }}" href="{{ item.href | relative_url }}" target="{{ item.target }}">{{ item.link-text }}</a>
          </li>
          {% endfor %}
        </ul>
      </li>
      <li class="hidden-xs visible-sm visible-lg">
        <ul class="nav-platforms">
          {% for item in site.posts-platforms %}
          <li><a href="{{ item.href | relative_url }}" target="{{ item.target }}" aria-label="{{ item.aria-label }}"><span class="icon {{ item.icon }}"></span></a></li>
          {% endfor %}
        </ul>  
      </li>
      <li>
        <ul class="search-toggle-navigation">
          {% for item in site.posts-toggle-navigation %}
          <li class="toggle-navigation visible-xs visible-m hidden-lg">
            <a href="{{ item.href }}" uk-toggle class="icon {{ item.icon }}" aria-label="{{ item.aria-label }}"></a>
          </li>
          {% endfor %}  
        </ul>
      </li>    
    </ul>  
  </nav>
</div>
<!-- Nav end -->
