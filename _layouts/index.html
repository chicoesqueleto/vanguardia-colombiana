---
layout: compress
---

<!DOCTYPE html>
<html lang="{{ site.lang }}" class="index">
{% include head.html %}
  <body>
    {% include navigation.html %}
    <figure class="header-image visible-xs visible-sm hidden-lg">
      <img
        srcset="
          {{ page.hero-image-xs | relative_url }} 696w,
          {{ page.hero-image-sm | relative_url }} 1536w"
        sizes="
          (min-width: 641px) 768px,
          375px"
        src="{{ page.hero-image-sm | relative_url }}"  
        alt="{{ page.hero-image-alt }}"
        loading="lazy">
    </figure>  
    <header class="full-width"> 
      <div class="header-text">
        <h1 class="h-xxl">{{ page.heading }}</h1>
        {{ page.content | markdownify | replace: '<p>', '<p class="p-base">' }}
        <ul>
          <li><a class="button button-base">Nuestro Programa</a></li>
          <li><a class="button button-base button-ghost">Únete</a></li>
        </ul> 
      </div>
      <figure class="header-image hidden-xs hidden-sm visible-lg">
        <img src="{{ page.hero-image-lg | relative_url }}" alt="{{ page.hero-image-alt }}" loading="lazy">
      </figure>
    </header>
    <main>
      <section class="presentation-video">
        <div class="video-container">
          <iframe src="https://www.youtube.com/embed/TNVTuR9BTqk?si=HcOCMGl7qeHaHXnW" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
      </section>  
    </main>
    {% include uikit-javascript.html %}
  </body>
</html>
